[tool.ruff]
line-length = 120
# Python 3.13 matches Home Assistant Core's current minimum runtime. Bumping this to py314 lets
# ruff format strip parens around `except (A, B):` (PEP 758), which then fails to parse on 3.13.
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ARG",
  "SIM",
  "RET",
  "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]
"custom_components/eos/*.py" = ["ARG"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.mypy]
# Matches the CI/runtime Python, not the minimum supported version. mypy parses installed deps
# (including Home Assistant Core, which uses PEP 758 bare-comma `except` syntax on 3.14) and
# must allow whatever syntax they use. `ruff.target-version` stays at py313 so our own source
# remains parseable by Python 3.13.
python_version = "3.14"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
strict_equality = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "homeassistant.*",
]
ignore_missing_imports = true
