name: Code Checking

on:
  pull_request:

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Ruff format check
        run: |
          ruff format . --check

      - name: Run Ruff lint
        run: |
          ruff check .

      - name: Run Mypy
        run: |
          mypy custom_components/harvia
